name: Daily fetch

on:
  schedule:
    - cron: "30 5 * * *" # every day at 05:30 UTC (06:30 Berlin in winter)
  workflow_dispatch: # "Run workflow" button for a fetch on demand

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Fetch news and data
        run: python scripts/fetch.py

      - name: Save the new data
        run: |
          git config user.name "metals-bot"
          git config user.email "metals-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Daily data $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin main && exit 0
            echo "Push failed, retrying ($i)..."
            sleep 5
          done
          exit 1
